name: Auto Update Bharat TV Channels

on:
  schedule:
    # Runs every hour (24x daily) at minute :17 to avoid top-of-hour GitHub Actions load spikes
    - cron: '17 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: channel-catalog-refresh
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run Multi-Source Indian Channel Discovery & Deep HLS Verification
        run: |
          if [ -f "channel_updater.py" ]; then
            python channel_updater.py
          elif [ -f "tools/channel_updater.py" ]; then
            python tools/channel_updater.py
          else
            echo "Error: channel_updater.py not found in repository root or tools/"
            exit 1
          fi

      - name: Validate Generated Catalogue & Stream Identity Integrity
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          for candidate in (Path('.'), Path('tools')):
              if (candidate / 'channel_updater.py').is_file():
                  sys.path.insert(0, str(candidate))
                  break
          try:
              from channel_updater import canonical_channel_key, classify_tier, known_channel_mismatch
          except ImportError:
              def canonical_channel_key(name: str, tvg_id: str = "") -> str:
                  raw = (name or "").strip().lower()
                  if not raw and tvg_id:
                      raw = tvg_id.split("@")[0].replace(".in", "").lower()
                  cleaned = re.sub(r"[\(\[][^\)\]]*[\)\]]", " ", raw)
                  cleaned = re.sub(r"\b(hd|sd|fhd|4k|uhd|official|live|stream)\b", " ", cleaned)
                  return re.sub(r"[^a-z0-9]+", "", cleaned)
              def classify_tier(name: str) -> str:
                  return "FTA"
              def known_channel_mismatch(name: str, url: str) -> bool:
                  return False

          json_path = Path('channels.json')
          if not json_path.is_file():
              raise SystemExit("Fatal: channels.json does not exist!")

          data = json.loads(json_path.read_text(encoding='utf-8'))
          raw_channels = data.get('channels', [])
          if not raw_channels:
              raise SystemExit('Refusing to publish an empty channel catalogue')

          # Pass 1: Identify generic stream URLs claimed by 3+ unrelated channels
          url_owners = {}
          for channel in raw_channels:
              name = channel.get('name', '').strip()
              url = channel.get('url', '').strip()
              owner_key = canonical_channel_key(name, channel.get('id', '')) or name.lower()
              if url:
                  url_owners.setdefault(url, set()).add(owner_key)

          overused_urls = {u for u, owners in url_owners.items() if len(owners) >= 3}
          if overused_urls:
              print(f"[Sanitize] Removing {len(overused_urls)} stream URLs claimed by 3+ channels:")
              for ou in overused_urls:
                  print(f"  - {ou}")

          # Pass 2: Clean and validate channel entries
          clean_channels = []
          for channel in raw_channels:
              name = channel.get('name', '').strip()
              url = channel.get('url', '').strip()
              fallbacks = [fb for fb in channel.get('fallback_urls', []) if fb]

              if not name:
                  continue

              candidate_urls = [
                  u for u in [url] + fallbacks
                  if u.startswith(('https://', 'http://'))
                  and u not in overused_urls
                  and not known_channel_mismatch(name, u)
              ]

              if not candidate_urls:
                  print(f"[Sanitize] Skipping channel with no valid streams: {name}")
                  continue

              primary = candidate_urls[0]
              clean_fallbacks = []
              seen_fb = {primary}
              for fb in candidate_urls[1:]:
                  if fb not in seen_fb:
                      clean_fallbacks.append(fb)
                      seen_fb.add(fb)

              tier = channel.get('tier')
              if tier not in ('FTA', 'PAID'):
                  tier = classify_tier(name)
              if tier not in ('FTA', 'PAID'):
                  tier = 'FTA'

              channel['url'] = primary
              channel['fallback_urls'] = clean_fallbacks
              channel['tier'] = tier
              channel['streams'] = [{"name": f"Server {i+1}", "url": u} for i, u in enumerate([primary] + clean_fallbacks)]
              clean_channels.append(channel)

          if len(clean_channels) < 100:
              raise SystemExit(f"Fatal: only {len(clean_channels)} valid channels remaining after sanitization (<100 safety threshold)!")

          for idx, ch in enumerate(clean_channels, start=1):
              ch['ch_no'] = idx

          data['channels'] = clean_channels
          data['total_channels'] = len(clean_channels)
          data['fta_channels'] = sum(1 for c in clean_channels if c.get('tier') == 'FTA')
          data['paid_channels'] = sum(1 for c in clean_channels if c.get('tier') == 'PAID')
          json_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          m3u_lines = ['#EXTM3U url-tvg="https://iptv-org.github.io/epg/guides/in.xml"']
          for ch in clean_channels:
              logo_attr = f' tvg-logo="{ch["logo_url"]}"' if ch.get("logo_url") else ""
              m3u_lines.append(
                  f'#EXTINF:-1 tvg-id="{ch.get("id", "")}" tvg-chno="{ch["ch_no"]}" tvg-language="{ch.get("language", "")}" '
                  f'tvg-tier="{ch["tier"]}"{logo_attr} group-title="{ch.get("category", "")}",{ch["name"]}'
              )
              m3u_lines.append(ch["url"])
          Path('channels.m3u').write_text('\n'.join(m3u_lines) + '\n', encoding='utf-8')

          print(
              f"Validated & sanitized {len(clean_channels)} channels "
              f"(FTA: {data['fta_channels']}, PAID: {data['paid_channels']}) "
              f"with zero cross-channel mismatches or overused streams."
          )
          PY

      - name: Commit and Push Updated Channels
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BharatTV Channel Bot"
          git add channels.json channels.m3u
          if git diff --staged --quiet; then
            echo "No changes in channels. Everything is up to date."
          else
            git commit -m "Auto-update verified Indian FTA & Paid channel catalogue (Hourly) [skip ci]"
            git pull --rebase --autostash
            git push
          fi
